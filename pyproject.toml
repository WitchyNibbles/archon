[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "archon"
version = "0.1.0"
description = "A local evidence-backed engineering workflow for Claude Code"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "mcp==2.2.0",
  "pydantic>=2,<3",
]

[project.urls]
Repository = "https://github.com/WitchyNibbles/archon"
Documentation = "https://github.com/WitchyNibbles/archon/tree/main/docs"
Issues = "https://github.com/WitchyNibbles/archon/issues"

[project.scripts]
archon = "archon.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/archon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: requires an authenticated local Claude Code runtime",
  "sandbox: requires bubblewrap on the host",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/archon"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
