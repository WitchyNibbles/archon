name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # The check profile is enforced by bubblewrap; without it the sandbox-marked
      # tests skip and AC-16 goes unproven on CI. A skip is never a pass, so this
      # reports what the runner can actually do and the record states it.
      - name: Install sandbox dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat

      # Diagnostic only — it must never decide whether the job runs.
      #
      # The first CI run of this repository failed here, and the step was wrong,
      # not the runner: `set -e` turned a capability probe into a gate, so a
      # runner that cannot unshare a network namespace failed the whole matrix
      # before a single test executed. A probe that can fail the build is not a
      # probe. What the runner reported, verbatim:
      #     bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted
      - name: Report sandbox availability
        continue-on-error: true
        run: |
          set +e
          bwrap --version
          socat -V | head -1
          echo "--- unshare-net (the profile's own flag) ---"
          bwrap --ro-bind / / --unshare-net -- true \
            && echo "RESULT: unshare-net usable" \
            || echo "RESULT: unshare-net refused (exit $?)"
          echo "--- without unshare-net ---"
          bwrap --ro-bind / / -- true \
            && echo "RESULT: bwrap usable without netns" \
            || echo "RESULT: bwrap unusable entirely (exit $?)"
          echo "--- what the kernel module says ---"
          cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo "(no unprivileged_userns_clone)"
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo "(no apparmor userns restriction knob)"
          exit 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run --locked ruff check src tests scripts

      - name: Type check
        run: uv run --locked mypy

      # Live tests need an authenticated Claude Code runtime and model quota; they are
      # recorded separately in docs/verification.md, never in ordinary CI.
      - name: Test
        run: uv run --locked pytest -m 'not live' -q

      # Says plainly whether AC-16 was proven on this runner or merely skipped.
      - name: Report which confinement tests actually ran
        continue-on-error: true
        run: |
          set +e
          uv run --locked pytest -m sandbox -q -rs 2>&1 | tail -20
          exit 0

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build distribution
        run: uv build --no-sources
      - name: Check packaged assets are present
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, sys
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if not wheels:
              sys.exit("no wheel was built")
          names = set(zipfile.ZipFile(wheels[-1]).namelist())
          required = [
              "archon/assets/claude-block.md",
              "archon/assets/archon/skills/archon-manager/SKILL.md",
              "archon/assets/archon/agents/archon-familiar.md",
              "archon/assets/archon/agents/archon-warden.md",
              "archon/assets/archon/agents/archon-oracle.md",
              "archon/assets/archon/reviewers/reviewer.md",
              "archon/assets/archon/reviewers/qa_engineer.md",
              "archon/assets/archon/reviewers/security_reviewer.md",
              "archon/assets/archon/hooks/hooks.json",
              "archon/assets/archon/.mcp.json",
              "archon/assets/archon/.claude-plugin/plugin.json",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              sys.exit("wheel is missing packaged assets: " + ", ".join(missing))
          print(f"{wheels[-1].name} carries all {len(required)} required assets")
          PY
